<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Spotify PWA - YouTube Stream</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #181818;
            --accent-color: #1db954;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding-bottom: 140px;
        }
        header {
            padding: 20px;
            background-color: var(--surface-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }
        .search-box { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: none;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            margin-top: 5px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .tab-btn {
            background: #2a2a2a;
            border: none;
            color: var(--text-secondary);
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: black;
        }
        .categories-bar {
            display: flex;
            gap: 8px;
            padding: 10px 20px 0 20px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .cat-chip {
            background: #222;
            border: 1px solid #333;
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .cat-chip:hover { background: #333; }
        .container { padding: 20px; }
        h3 { color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .song-list { display: flex; flex-direction: column; gap: 10px; }
        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-color);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .song-item:active { background: #282828; }
        .song-info { flex: 1; overflow: hidden; padding-right: 10px; }
        .song-info h4 { margin: 0 0 5px 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { margin: 0; font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .song-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .action-btn {
            background: #2a2a2a;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 0.9rem;
        }
        .action-btn.play { background: var(--accent-color); color: black; font-weight: bold; }
        
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
            z-index: 100;
        }
        .player-details { display: flex; justify-content: space-between; align-items: center; }
        audio { width: 100%; }
        .offline-badge {
            font-size: 0.7rem;
            background: #222;
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--accent-color);
        }
        .loading-spinner {
            font-size: 0.85rem;
            color: var(--accent-color);
            display: none;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Spotify Web Lite (YouTube Stream)</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Busca cualquier canción o artista comercial..." oninput="filtrarCanciones()">
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" id="tabHome" onclick="cambiarPestana('home')">Inicio / Sugerencias</button>
            <button class="tab-btn" id="tabHistory" onclick="cambiarPestana('history')">Historial Escuchadas</button>
        </div>
        <div class="categories-bar">
            <span class="cat-chip" onclick="filtrarPorCategoria('Bad Bunny hits')">Reggaeton</span>
            <span class="cat-chip" onclick="filtrarPorCategory('Top Pop songs')">Pop</span>
            <span class="cat-chip" onclick="filtrarPorCategory('Rock classics')">Rock</span>
            <span class="cat-chip" onclick="filtrarPorCategory('Electronic music')">Electronic</span>
            <span class="cat-chip" onclick="filtrarPorCategory('Lofi hip hop beats')">Lofi</span>
        </div>
    </header>

    <div class="container">
        <h3 id="sectionTitle">Música comercial sugerida</h3>
        <div class="song-list" id="songList"></div>
    </div>

    <div class="player-bar">
        <div class="player-details">
            <div>
                <strong id="currentTitle">Selecciona una canción</strong>
                <p id="currentArtist" style="margin:0; font-size:0.8rem; color:var(--text-secondary);">-</p>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="loadingAudio" class="loading-spinner">Cargando audio...</span>
                <span class="offline-badge">YouTube Stream</span>
            </div>
        </div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        let pestanaActual = 'home';
        let historialReproduccion = JSON.parse(localStorage.getItem('historial_reproducidas')) || [];
        let busquedasRecientes = JSON.parse(localStorage.getItem('historial_busquedas')) || [];

        function cambiarPestana(tipo) {
            pestanaActual = tipo;
            document.getElementById('tabHome').classList.toggle('active', tipo === 'home');
            document.getElementById('tabHistory').classList.toggle('active', tipo === 'history');
            
            if (tipo === 'history') {
                mostrarHistorial();
            } else {
                cargarSugerenciasIntuitivas();
            }
        }

        function registrarHistorialReproduccion(song) {
            historialReproduccion = historialReproduccion.filter(s => s.videoId !== song.videoId);
            historialReproduccion.unshift(song);
            if (historialReproduccion.length > 50) historialReproduccion.pop();
            localStorage.setItem('historial_reproducidas', JSON.stringify(historialReproduccion));
        }

        async function descargarCancion(event, song) {
            event.stopPropagation();
            alert("Para descargar canciones en streaming de YouTube de forma offline, asegúrate de mantener abierta la PWA con conexión.");
        }

        async function cargarSugerenciasIntuitivas() {
            if (pestanaActual !== 'home') return;
            document.getElementById('sectionTitle').innerText = "Música comercial sugerida";
            let termino = busquedasRecientes.length > 0 ? busquedasRecientes[0] : "Top hits 2026";
            buscarMusica(termino, "Sugeridas basadas en tus búsquedas");
        }

        function filtrarPorCategory(categoria) {
            document.getElementById('searchInput').value = '';
            cambiarPestana('home');
            buscarMusica(categoria, `Categoría: ${categoria}`);
        }

        function mostrarHistorial() {
            document.getElementById('sectionTitle').innerText = "Historial de canciones escuchadas";
            renderizarLista(historialReproduccion, "No tienes canciones en tu historial aún. ¡Empieza a reproducir música!");
        }

        async function buscarMusica(query, tituloSeccion) {
            if (pestanaActual !== 'home') return;
            document.getElementById('sectionTitle').innerText = tituloSeccion;
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '<p style="color:var::text-secondary; color: var(--text-secondary);">Buscando en YouTube...</p>';

            try {
                // Usamos la API pública de Invidious para buscar videos musicales sin restricciones
                const response = await fetch(`https://invidious.io.lol/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
                const data = await response.json();

                if (pestanaActual !== 'home') return;

                const cancionesFormateadas = data.filter(item => item.type === 'video').map(item => ({
                    videoId: item.videoId,
                    title: item.title,
                    artist: item.author,
                    duration: item.lengthSeconds
                }));

                renderizarLista(cancionesFormateadas);
            } catch (error) {
                // Fallback a otra instancia de Invidious si la primera falla
                try {
                    const responseAlt = await fetch(`https://vid.puffyan.us/api/v1/search?q=${encodeURIComponent(query)}&type=video`);
                    const dataAlt = await responseAlt.json();
                    const cancionesFormateadas = dataAlt.filter(item => item.type === 'video').map(item => ({
                        videoId: item.videoId,
                        title: item.title,
                        artist: item.author,
                        duration: item.lengthSeconds
                    }));
                    renderizarLista(cancionesFormateadas);
                } catch (err) {
                    listContainer.innerHTML = '<p style="color:var(--text-secondary);">Error al conectar con los servidores de búsqueda de YouTube.</p>';
                }
            }
        }

        function renderizarLista(canciones, mensajeVacio = "No se encontraron canciones.") {
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '';
            
            if (!canciones || canciones.length === 0) {
                listContainer.innerHTML = `<p style="color:var(--text-secondary);">${mensajeVacio}</p>`;
                return;
            }

            canciones.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.innerHTML = `
                    <div class="song-info">
                        <h4>${song.title}</h4>
                        <p>${song.artist}</p>
                    </div>
                    <div class="song-actions">
                        <button class="action-btn" title="Opciones" onclick='descargarCancion(event, ${JSON.stringify(song)})'>⭐</button>
                        <button class="action-btn play" title="Reproducir">▶</button>
                    </div>
                `;
                item.onclick = () => obtenerAudioYReproducir(song);
                listContainer.appendChild(item);
            });
        }

        async function obtenerAudioYReproducir(song) {
            document.getElementById('currentTitle').innerText = song.title;
            document.getElementById('currentArtist').innerText = song.artist;
            document.getElementById('loadingAudio').style.display = 'inline';

            try {
                // Consultamos el detalle del video en Invidious para extraer el enlace directo de audio puro
                const response = await fetch(`https://invidious.io.lol/api/v1/videos/${song.videoId}`);
                const data = await response.json();

                // Buscamos formato de audio adaptable (adaptiveFormats o adaptiveStreams)
                let audioFormats = data.adaptiveFormats ? data.adaptiveFormats.filter(f => f.type && f.type.includes('audio')) : [];
                
                if (audioFormats.length === 0 && data.formatStreams) {
                    audioFormats = data.formatStreams;
                }

                if (audioFormats.length > 0) {
                    // Tomamos el mejor flujo de audio disponible
                    const streamUrl = audioFormats[0].url;
                    
                    const player = document.getElementById('audioPlayer');
                    player.src = streamUrl;
                    player.play().catch(err => console.log("Error al reproducir audio:", err));
                    
                    registrarHistorialReproduccion(song);
                } else {
                    alert("No se pudo extraer el flujo de audio para este video.");
                }
            } catch (e) {
                alert("Error al procesar el flujo de audio de YouTube.");
            } finally {
                document.getElementById('loadingAudio').style.display = 'none';
            }
        }

        let timerBusqueda;
        function filtrarCanciones() {
            clearTimeout(timerBusqueda);
            const query = document.getElementById('searchInput').value.trim();

            if (query.length === 0) {
                cambiarPestana('home');
                return;
            }

            if (query.length > 2 && !busquedasRecientes.includes(query)) {
                busquedasRecientes.unshift(query);
                if (busquedasRecientes.length > 5) busquedasRecientes.pop();
                localStorage.setItem('historial_busquedas', JSON.stringify(busquedasRecientes));
            }

            timerBusqueda = setTimeout(() => {
                if (pestanaActual === 'history') cambiarPestana('home');
                buscarMusica(query, "Resultados de búsqueda");
            }, 600);
        }

        cargarSugerenciasIntuitivas();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
            });
        }
    </script>
</body>
</html>
