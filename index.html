<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Lite - Móvil</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #181818;
            --accent-color: #1db954;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding-bottom: 150px;
        }
        header {
            padding: 20px;
            background-color: var(--surface-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }
        .search-box { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: none;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .container { padding: 20px; }
        .song-list { display: flex; flex-direction: column; gap: 10px; }
        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-color);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .song-item:active { background: #282828; }
        .song-info { flex: 1; overflow: hidden; padding-right: 10px; }
        .song-info h4 { margin: 0 0 5px 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { margin: 0; font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .action-btn {
            background: var(--accent-color);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: black;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 15px 20px;
            box-sizing: border-box;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        audio { width: 100%; outline: none; }
        .status-text { font-size: 0.85rem; color: var(--accent-color); }
    </style>
</head>
<body>

    <header>
        <h1>Spotify Web Lite</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Escribe cualquier artista o canción..." oninput="filtrarCanciones()">
        </div>
    </header>

    <div class="container">
        <div class="song-list" id="songList">
            <p style="color:var(--text-secondary);">Busca cualquier canción para comenzar.</p>
        </div>
    </div>

    <div class="player-bar">
        <div>
            <strong id="currentTitle">Selecciona una pista</strong>
            <span id="loadingStatus" class="status-text" style="display:none;"> | Conectando flujo...</span>
        </div>
        <audio id="audioPlayer" controls autoplay></audio>
    </div>

    <script>
        // Nodos públicos optimizados para extracción directa de audio web
        const INSTANCES = [
            'https://pipedapi.kavin.rocks',
            'https://api.piped.private.coffee',
            'https://pipedapi.adminforge.de'
        ];

        let timerBusqueda;

        function filtrarCanciones() {
            clearTimeout(timerBusqueda);
            const query = document.getElementById('searchInput').value.trim();
            if (query.length < 2) return;

            timerBusqueda = setTimeout(() => {
                buscarMusica(query);
            }, 500);
        }

        async function buscarMusica(query) {
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '<p style="color:var(--text-secondary);">Buscando catálogo...</p>';

            let data = null;
            for (let instance of INSTANCES) {
                try {
                    const res = await fetch(`${instance}/search?q=${encodeURIComponent(query)}&filter=videos`);
                    if (res.ok) {
                        data = await res.json();
                        break;
                    }
                } catch (e) {}
            }

            if (!data || !data.items) {
                listContainer.innerHTML = '<p style="color:var(--text-secondary);">No se encontraron resultados.</p>';
                return;
            }

            const items = data.items.map(item => ({
                videoId: item.url ? item.url.replace('/watch?v=', '') : '',
                title: item.title,
                artist: item.uploaderName || 'Artista comercial'
            })).filter(s => s.videoId);

            renderizarLista(items);
        }

        function renderizarLista(canciones) {
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '';
            
            canciones.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.innerHTML = `
                    <div class="song-info">
                        <h4>${song.title}</h4>
                        <p>${song.artist}</p>
                    </div>
                    <button class="action-btn">▶</button>
                `;
                item.onclick = () => reproducirAudioDirecto(song);
                listContainer.appendChild(item);
            });
        }

        async function reproducirAudioDirecto(song) {
            document.getElementById('currentTitle').innerText = song.title;
            document.getElementById('loadingStatus').style.display = 'inline';

            let audioUrl = null;
            for (let instance of INSTANCES) {
                try {
                    const res = await fetch(`${instance}/streams/${song.videoId}`);
                    if (res.ok) {
                        const streamData = await res.json();
                        // Seleccionamos el flujo de audio de alta calidad disponible
                        if (streamData.audioStreams && streamData.audioStreams.length > 0) {
                            audioUrl = streamData.audioStreams[0].url;
                            break;
                        }
                    }
                } catch (e) {}
            }

            document.getElementById('loadingStatus').style.display = 'none';

            if (audioUrl) {
                const player = document.getElementById('audioPlayer');
                player.src = audioUrl;
                player.play().catch(err => console.log("Reproducción automática:", err));
            } else {
                alert("No se pudo obtener el flujo de audio directo de esta pista. Prueba con otra.");
            }
        }
    </script>
</body>
</html>
