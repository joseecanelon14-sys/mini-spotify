<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Lite - APK</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #181818;
            --accent-color: #1db954;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding-bottom: 160px;
        }
        header {
            padding: 20px;
            background-color: var(--surface-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }
        .search-box { display: flex; flex-direction: column; gap: 8px; position: relative; }
        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 25px;
            border: none;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }
        .suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #282828;
            border-radius: 8px;
            overflow: hidden;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: none;
        }
        .suggestion-item {
            padding: 10px 15px;
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        .suggestion-item:hover { background: #383838; }

        .container { padding: 20px; }
        h3 { color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .song-list { display: flex; flex-direction: column; gap: 10px; }
        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-color);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .song-item:active { background: #282828; }
        .song-info { flex: 1; overflow: hidden; padding-right: 10px; }
        .song-info h4 { margin: 0 0 5px 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { margin: 0; font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .action-btn {
            background: var(--accent-color);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: black;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 10px 20px;
            box-sizing: border-box;
            z-index: 100;
        }
        iframe {
            width: 100%;
            height: 80px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Spotify Web Lite</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Escribe un artista o canción..." oninput="manejarInputBusqueda()">
            <div id="suggestionsDropdown" class="suggestions-dropdown"></div>
        </div>
    </header>

    <div class="container">
        <h3 id="sectionTitle">Resultados de la Búsqueda</h3>
        <div class="song-list" id="songList">
            <p style="color:var(--text-secondary);">Comienza a escribir para buscar música comercial...</p>
        </div>
    </div>

    <div class="player-bar">
        <div style="margin-bottom: 5px; font-size: 0.85rem; color: var(--text-secondary);" id="nowPlayingText">Reproductor listo</div>
        <div id="playerContainer">
            <p style="margin: 0; font-size: 0.8rem; color: #777;">Selecciona una pista</p>
        </div>
    </div>

    <script>
        let timerBusqueda;
        const CACHE_NAME = 'spotify-lite-cache-v1';
        const CACHE_EXPIRATION_DAYS = 15;

        // Caché local de 15 días para canciones reproducidas
        async function gestionarCacheReproduccion(songId, songData) {
            if ('caches' in window) {
                const cache = await caches.open(CACHE_NAME);
                if (songData) {
                    const payload = { timestamp: Date.now(), data: songData };
                    await cache.put(`/song/${songId}`, new Response(JSON.stringify(payload)));
                } else {
                    const res = await cache.match(`/song/${songId}`);
                    if (res) {
                        const json = await res.json();
                        const dias = (Date.now() - json.timestamp) / (1000 * 60 * 60 * 24);
                        if (dias < CACHE_EXPIRATION_DAYS) return json.data;
                        await cache.delete(`/song/${songId}`);
                    }
                }
            }
            return null;
        }

        function manejarInputBusqueda() {
            clearTimeout(timerBusqueda);
            const query = document.getElementById('searchInput').value.trim();

            if (query.length < 2) {
                document.getElementById('suggestionsDropdown').style.display = 'none';
                return;
            }

            timerBusqueda = setTimeout(() => {
                buscarMusica(query);
            }, 400);
        }

        async function buscarMusica(query) {
            const dropdown = document.getElementById('suggestionsDropdown');
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '<p style="color:var(--text-secondary);">Buscando pistas...</p>';

            try {
                const res = await fetch(`https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                const sugerencias = data[1] || [];

                if (sugerencias.length > 0) {
                    dropdown.innerHTML = sugerencias.map(s => `<div class="suggestion-item" onclick="seleccionarSugerencia('${s}')">${s}</div>`).join('');
                    dropdown.style.display = 'block';
                } else {
                    dropdown.style.display = 'none';
                }

                ejecutarBusquedaInterna(query);
            } catch (e) {
                listContainer.innerHTML = '<p style="color:var(--text-secondary);">Error al conectar. Verifica tu red.</p>';
            }
        }

        async function ejecutarBusquedaInterna(query) {
            const listContainer = document.getElementById('songList');
            
            // Primero intentamos buscar en caché si ya existe una coincidencia o historial reciente
            let cachedResult = await gestionarCacheReproduccion(query);
            if (cachedResult) {
                renderizarLista([cachedResult]);
                return;
            }

            try {
                const res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=videos`);
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    listContainer.innerHTML = '<p style="color:var(--text-secondary);">No se encontraron resultados.</p>';
                    return;
                }

                const items = data.items.map(item => ({
                    videoId: item.url ? item.url.replace('/watch?v=', '') : '',
                    title: item.title,
                    artist: item.uploaderName || 'Artista comercial'
                })).filter(s => s.videoId);

                renderizarLista(items);
            } catch (err) {
                listContainer.innerHTML = '<p style="color:var(--text-secondary);">Intenta de nuevo con otra búsqueda.</p>';
            }
        }

        function seleccionarSugerencia(titulo) {
            document.getElementById('searchInput').value = titulo;
            document.getElementById('suggestionsDropdown').style.display = 'none';
            ejecutarBusquedaInterna(titulo);
        }

        function renderizarLista(canciones) {
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '';
            
            canciones.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.innerHTML = `
                    <div class="song-info">
                        <h4>${song.title}</h4>
                        <p>${song.artist}</p>
                    </div>
                    <button class="action-btn">▶</button>
                `;
                item.onclick = () => reproducirCancion(song);
                listContainer.appendChild(item);
            });
        }

        async function reproducirCancion(song) {
            document.getElementById('nowPlayingText').innerText = `Reproduciendo: ${song.title}`;
            
            // Guardar en caché con vigencia de 15 días
            await gestionarCacheReproduccion(song.videoId, song);

            const playerContainer = document.getElementById('playerContainer');
            playerContainer.innerHTML = `
                <iframe src="https://www.youtube-nocookie.com/embed/${song.videoId}?autoplay=1&enablejsapi=1" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            `;
        }

        // Script de control para mitigar suspensiones de WebView al minimizar la app
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                console.log("App en segundo plano - Manteniendo estado multimedia");
            }
        });
    </script>
</body>
</html>
