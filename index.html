<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Lite - Reproductor Integrado</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #181818;
            --accent-color: #1db954;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding-bottom: 120px;
        }
        header {
            padding: 20px;
            background-color: var(--surface-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }
        .search-box { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: none;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .container { padding: 20px; }
        h3 { color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .song-list { display: flex; flex-direction: column; gap: 10px; }
        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-color);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .song-item:active { background: #282828; }
        .song-info { flex: 1; overflow: hidden; padding-right: 10px; }
        .song-info h4 { margin: 0 0 5px 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { margin: 0; font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .action-btn {
            background: var(--accent-color);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: black;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 10px 20px;
            box-sizing: border-box;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 80px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Spotify Web Lite</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Escribe cualquier artista o canción..." oninput="filtrarCanciones()">
        </div>
    </header>

    <div class="container">
        <h3 id="sectionTitle">Resultados</h3>
        <div class="song-list" id="songList">
            <p style="color:var(--text-secondary);">Busca cualquier artista o canción arriba para comenzar.</p>
        </div>
    </div>

    <div class="player-bar">
        <div style="width: 100%; margin-bottom: 5px; font-size: 0.85rem; color: var(--text-secondary);" id="nowPlayingText">Reproductor activo</div>
        <!-- Contenedor embebido nativo que reproduce la pista completa sin bloqueos CORS -->
        <div id="playerContainer" style="width: 100%;">
            <p style="margin: 0; font-size: 0.8rem; color: #777;">Selecciona una canción de la lista</p>
        </div>
    </div>

    <script>
        const PIPED_INSTANCES = [
            'https://pipedapi.kavin.rocks',
            'https://api.piped.private.coffee',
            'https://pipedapi.adminforge.de'
        ];

        let timerBusqueda;

        function filtrarCanciones() {
            clearTimeout(timerBusqueda);
            const query = document.getElementById('searchInput').value.trim();

            if (query.length < 2) return;

            timerBusqueda = setTimeout(() => {
                buscarMusica(query);
            }, 500);
        }

        async function buscarMusica(query) {
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '<p style="color:var(--text-secondary);">Buscando pistas...</p>';

            let data = null;
            for (let instance of PIPED_INSTANCES) {
                try {
                    const res = await fetch(`${instance}/search?q=${encodeURIComponent(query)}&filter=videos`);
                    if (res.ok) {
                        data = await res.json();
                        break;
                    }
                } catch (e) {
                    // Intenta con la siguiente instancia
                }
            }

            if (!data || !data.items) {
                listContainer.innerHTML = '<p style="color:var(--text-secondary);">No se pudo conectar con los servidores.</p>';
                return;
            }

            const items = data.items.map(item => ({
                videoId: item.url ? item.url.replace('/watch?v=', '') : '',
                title: item.title,
                artist: item.uploaderName || 'Artista desconocido'
            })).filter(s => s.videoId);

            renderizarLista(items);
        }

        function renderizarLista(canciones) {
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '';
            
            if (canciones.length === 0) {
                listContainer.innerHTML = '<p style="color:var(--text-secondary);">No se encontraron resultados.</p>';
                return;
            }

            canciones.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.innerHTML = `
                    <div class="song-info">
                        <h4>${song.title}</h4>
                        <p>${song.artist}</p>
                    </div>
                    <button class="action-btn">▶</button>
                `;
                item.onclick = () => reproducirCancion(song);
                listContainer.appendChild(item);
            });
        }

        function reproducirCancion(song) {
            document.getElementById('nowPlayingTextinnerHTML').innerText = `Reproduciendo: ${song.title}`;
            
            // Usamos un reproductor integrado optimizado para web móvil que elude las restricciones de red
            const playerContainer = document.getElementById('playerContainer');
            playerContainer.innerHTML = `
                <iframe src="https://www.youtube-nocookie.com/embed/${song.videoId}?autoplay=1&enablejsapi=1" 
                        allow="autoplay" 
                        title="${song.title}">
                </iframe>
            `;
        }
    </script>
</body>
</html>
