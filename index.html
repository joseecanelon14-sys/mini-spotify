<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Spotify PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #181818;
            --accent-color: #1db954;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding-bottom: 130px;
        }
        header {
            padding: 20px;
            background-color: var(--surface-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }
        .search-box { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: none;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            margin-top: 5px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .tab-btn {
            background: #2a2a2a;
            border: none;
            color: var(--text-secondary);
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: black;
        }
        .categories-bar {
            display: flex;
            gap: 8px;
            padding: 10px 20px 0 20px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .cat-chip {
            background: #222;
            border: 1px solid #333;
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .cat-chip:hover { background: #333; }
        .container { padding: 20px; }
        h3 { color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .song-list { display: flex; flex-direction: column; gap: 10px; }
        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-color);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .song-item:active { background: #282828; }
        .song-info { flex: 1; overflow: hidden; padding-right: 10px; }
        .song-info h4 { margin: 0 0 5px 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { margin: 0; font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .song-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .action-btn {
            background: #2a2a2a;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 0.9rem;
        }
        .action-btn.play { background: var(--accent-color); color: black; font-weight: bold; }
        
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
            z-index: 100;
        }
        .player-details { display: flex; justify-content: space-between; align-items: center; }
        audio { width: 100%; }
        .offline-badge {
            font-size: 0.7rem;
            background: #222;
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Spotify Web Lite</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar artista, álbum o canción..." oninput="filtrarCanciones()">
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" id="tabHome" onclick="cambiarPestana('home')">Inicio / Sugerencias</button>
            <button class="tab-btn" id="tabHistory" onclick="cambiarPestana('history')">Historial Escuchadas</button>
        </div>
        <div class="categories-bar">
            <span class="cat-chip" onclick="filtrarPorCategoria('Pop')">Pop</span>
            <span class="cat-chip" onclick="filtrarPorCategoria('Rock')">Rock</span>
            <span class="cat-chip" onclick="filtrarPorCategoria('Electronic')">Electronic</span>
            <span class="cat-chip" onclick="filtrarPorCategoria('Jazz')">Jazz</span>
            <span class="cat-chip" onclick="filtrarPorCategoria('Lofi')">Lofi</span>
            <span class="cat-chip" onclick="filtrarPorCategoria('Classical')">Classical</span>
        </div>
    </header>

    <div class="container">
        <h3 id="sectionTitle">Música sugerida para ti</h3>
        <div class="song-list" id="songList"></div>
    </div>

    <div class="player-bar">
        <div class="player-details">
            <div>
                <strong id="currentTitle">Selecciona una canción</strong>
                <p id="currentArtist" style="margin:0; font-size:0.8rem; color:var(--text-secondary);">-</p>
            </div>
            <span class="offline-badge">Caché 15 Días OK</span>
        </div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        let pestanaActual = 'home';
        let historialReproduccion = JSON.parse(localStorage.getItem('historial_reproducidas')) || [];
        let busquedasRecientes = JSON.parse(localStorage.getItem('historial_busquedas')) || [];

        function cambiarPestana(tipo) {
            pestanaActual = tipo;
            document.getElementById('tabHome').classList.toggle('active', tipo === 'home');
            document.getElementById('tabHistory').classList.toggle('active', tipo === 'history');
            
            if (tipo === 'history') {
                mostrarHistorial();
            } else {
                cargarSugerenciasIntuitivas();
            }
        }

        function registrarHistorialReproduccion(song) {
            historialReproduccion = historialReproduccion.filter(s => s.url !== song.url);
            historialReproduccion.unshift(song);
            if (historialReproduccion.length > 50) historialReproduccion.pop();
            localStorage.setItem('historial_reproducidas', JSON.stringify(historialReproduccion));
        }

        async function descargarCancion(event, song) {
            event.stopPropagation();
            try {
                const cache = await caches.open('music-cache-v15days');
                await cache.add(song.url);
                alert(`¡"${song.title}" descargada con éxito para modo offline!`);
            } catch (e) {
                alert("No se pudo descargar la canción. Verifica tu conexión.");
            }
        }

        async function cargarSugerenciasIntuitivas() {
            if (pestanaActual !== 'home') return;
            document.getElementById('sectionTitle').innerText = "Música sugerida para ti";
            let termino = busquedasRecientes.length > 0 ? busquedasRecientes[0] : "Pop";
            buscarMusica(termino, "Sugeridas basadas en tus gustos");
        }

        function filtrarPorCategoria(categoria) {
            document.getElementById('searchInput').value = '';
            cambiarPestana('home');
            buscarMusica(categoria, `Categoría: ${categoria}`);
        }

        function mostrarHistorial() {
            document.getElementById('sectionTitle').innerText = "Historial de canciones escuchadas";
            renderizarLista(historialReproduccion, "No tienes canciones en tu historial aún. ¡Empieza a reproducir música!");
        }

        async function buscarMusica(query, tituloSeccion) {
            if (pestanaActual !== 'home') return;
            document.getElementById('sectionTitle').innerText = tituloSeccion;
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '<p style="color:var(--text-secondary);">Buscando música...</p>';

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=30`);
                const data = await response.json();

                if (pestanaActual !== 'home') return;

                const cancionesFormateadas = data.results ? data.results.map(s => ({
                    title: s.trackName,
                    artist: s.artistName,
                    url: s.previewUrl
                })).filter(s => s.url) : [];

                renderizarLista(cancionesFormateadas);
            } catch (error) {
                listContainer.innerHTML = '<p style="color:var(--text-secondary);">Error al conectar con el servidor.</p>';
            }
        }

        function renderizarLista(canciones, mensajeVacio = "No se encontraron canciones.") {
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '';
            
            if (!canciones || canciones.length === 0) {
                listContainer.innerHTML = `<p style="color:var(--text-secondary);">${mensajeVacio}</p>`;
                return;
            }

            canciones.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.innerHTML = `
                    <div class="song-info">
                        <h4>${song.title}</h4>
                        <p>${song.artist}</p>
                    </div>
                    <div class="song-actions">
                        <button class="action-btn" title="Descargar para modo offline" onclick='descargarCancion(event, ${JSON.stringify(song)})'>📥</button>
                        <button class="action-btn play" title="Reproducir">▶</button>
                    </div>
                `;
                item.onclick = () => reproducirCancion(song);
                listContainer.appendChild(item);
            });
        }

        function reproducirCancion(song) {
            document.getElementById('currentTitle').innerText = song.title;
            document.getElementById('currentArtist').innerText = song.artist;
            
            const player = document.getElementById('audioPlayer');
            player.src = song.url;
            player.play().catch(err => console.log("Reproducción pausada:", err));

            registrarHistorialReproduccion(song);
        }

        let timerBusqueda;
        function filtrarCanciones() {
            clearTimeout(timerBusqueda);
            const query = document.getElementById('searchInput').value.trim();

            if (query.length === 0) {
                cambiarPestana('home');
                return;
            }

            if (query.length > 2 && !busquedasRecientes.includes(query)) {
                busquedasRecientes.unshift(query);
                if (busquedasRecientes.length > 5) busquedasRecientes.pop();
                localStorage.setItem('historial_busquedas', JSON.stringify(busquedasRecientes));
            }

            timerBusqueda = setTimeout(() => {
                if (pestanaActual === 'history') cambiarPestana('home');
                buscarMusica(query, "Resultados de búsqueda");
            }, 500);
        }

        cargarSugerenciasIntuitivas();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
            });
        }
    </script>
</body>
</html>
