<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor YouTube iFrame</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .player-container {
            position: relative;
            width: 100%;
            max-width: 560px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 560px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        button {
            padding: 0 20px;
            border-radius: 8px;
            border: none;
            background: #1db954;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Reproductor iFrame</h1>

    <div class="player-container">
        <!-- El iframe cargará el video de YouTube -->
        <iframe id="youtubePlayer" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="controls">
        <input type="text" id="videoUrl" placeholder="Pega el ID o URL de YouTube...">
        <button onclick="cambiarVideo()">Reproducir</button>
    </div>

    <script>
        function cambiarVideo() {
            const input = document.getElementById('videoUrl').value.trim();
            let videoId = '';

            if (input.includes('youtube.com') || input.includes('youtu.be')) {
                // Extraer el ID si pegan la URL completa
                const match = input.match(/(?:v=|youtu\.be\/)([\w-]{11})/);
                if (match) videoId = match[1];
            } else if (input.length === 11) {
                videoId = input; // Si pegan directamente el ID de 11 caracteres
            }

            if (videoId) {
                const iframe = document.getElementById('youtubePlayer');
                iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            } else {
                alert('Por favor, ingresa una URL o ID de YouTube válido.');
            }
        }
    </script>

</body>
</html>
