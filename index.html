<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Lite - Streaming Completo</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #181818;
            --accent-color: #1db954;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding-bottom: 140px;
        }
        header {
            padding: 20px;
            background-color: var(--surface-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-color); }
        .search-box { display: flex; gap: 10px; }
        input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 25px;
            border: none;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            padding: 0 20px;
            margin-top: 5px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .tab-btn {
            background: #2a2a2a;
            border: none;
            color: var(--text-secondary);
            padding: 8px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: black;
        }
        .categories-bar {
            display: flex;
            gap: 8px;
            padding: 10px 20px 0 20px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .cat-chip {
            background: #222;
            border: 1px solid #333;
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .cat-chip:hover { background: #333; }
        .container { padding: 20px; }
        h3 { color: var(--text-secondary); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .song-list { display: flex; flex-direction: column; gap: 10px; }
        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-color);
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .song-item:active { background: #282828; }
        .song-info { flex: 1; overflow: hidden; padding-right: 10px; }
        .song-info h4 { margin: 0 0 5px 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { margin: 0; font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .song-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .action-btn {
            background: var(--accent-color);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: black;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #181818;
            border-top: 1px solid #282828;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
            z-index: 100;
        }
        .player-details { display: flex; justify-content: space-between; align-items: center; }
        audio { width: 100%; }
        .offline-badge {
            font-size: 0.7rem;
            background: #222;
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--accent-color);
        }
        .loading-spinner {
            font-size: 0.85rem;
            color: var(--accent-color);
            display: none;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Spotify Web Lite</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Busca cualquier artista, álbum o canción..." oninput="filtrarCanciones()">
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" id="tabHome" onclick="cambiarPestana('home')">Inicio / Sugerencias</button>
            <button class="tab-btn" id="tabHistory" onclick="cambiarPestana('history')">Historial</button>
        </div>
        <div class="categories-bar">
            <span class="cat-chip" onclick="filtrarPorCategory('Top global hits 2026')">Top Global</span>
            <span class="cat-chip" onclick="filtrarPorCategory('Reggaeton mix 2026')">Reggaeton</span>
            <span class="cat-chip" onclick="filtrarPorCategory('Rock classics full songs')">Rock</span>
            <span class="cat-chip" onclick="filtrarPorCategory('Pop hits 2026')">Pop</span>
            <span class="cat-chip" onclick="filtrarPorCategory('Lofi hip hop beats')">Lofi</span>
        </div>
    </header>

    <div class="container">
        <h3 id="sectionTitle">Música sugerida</h3>
        <div class="song-list" id="songList"></div>
    </div>

    <div class="player-bar">
        <div class="player-details">
            <div>
                <strong id="currentTitle">Selecciona una canción</strong>
                <p id="currentArtist" style="margin:0; font-size:0.8rem; color:var(--text-secondary);">-</p>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <span id="loadingAudio" class="loading-spinner">Cargando audio...</span>
                <span class="offline-badge">Stream Activo</span>
            </div>
        </div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        let pestanaActual = 'home';
        let historialReproduccion = JSON.parse(localStorage.getItem('historial_reproducidas')) || [];
        let busquedasRecientes = JSON.parse(localStorage.getItem('historial_busquedas')) || [];

        // Lista actualizada y ampliada de instancias activas de Piped
        const PIPED_INSTANCES = [
            'https://api.piped.private.coffee',
            'https://pipedapi.adminforge.de',
            'https://api.piped.projectsegfau.lt',
            'https://pipedapi.kavin.rocks'
        ];
        let currentInstanceIndex = 0;

        async function fetchWithFallback(endpoint) {
            for (let i = 0; i < PIPED_INSTANCES.length; i++) {
                let instance = PIPED_INSTANCES[(currentInstanceIndex + i) % PIPED_INSTANCES.length];
                try {
                    const response = await fetch(`${instance}${endpoint}`, {
                        headers: { 'Accept': 'application/json' }
                    });
                    if (response.ok) {
                        currentInstanceIndex = (currentInstanceIndex + i) % PIPED_INSTANCES.length;
                        return await response.json();
                    }
                } catch (e) {
                    console.warn(`Instancia ${instance} no disponible, probando siguiente...`);
                }
            }
            throw new Error("Todas las instancias están ocupadas.");
        }

        function cambiarPestana(tipo) {
            pestanaActual = tipo;
            document.getElementById('tabHome').classList.toggle('active', tipo === 'home');
            document.getElementById('tabHistory').classList.toggle('active', tipo === 'history');
            
            if (tipo === 'history') {
                mostrarHistorial();
            } else {
                cargarSugerenciasIntuitivas();
            }
        }

        function registrarHistorialReproduccion(song) {
            historialReproduccion = historialReproduccion.filter(s => s.videoId !== song.videoId);
            historialReproduccion.unshift(song);
            if (historialReproduccion.length > 50) historialReproduccion.pop();
            localStorage.setItem('historial_reproducidas', JSON.stringify(historialReproduccion));
        }

        async function cargarSugerenciasIntuitivas() {
            if (pestanaActual !== 'home') return;
            document.getElementById('sectionTitle').innerText = "Música sugerida";
            let termino = busquedasRecientes.length > 0 ? busquedasRecientes[0] : "Top global hits 2026";
            buscarMusica(termino, "Basado en tus gustos");
        }

        function filtrarPorCategory(categoria) {
            document.getElementById('searchInput').value = '';
            cambiarPestana('home');
            buscarMusica(categoria, `Categoría: ${categoria}`);
        }

        function mostrarHistorial() {
            document.getElementById('sectionTitle').innerText = "Historial de reproducción";
            renderizarLista(historialReproduccion, "Aún no has reproducido ninguna canción.");
        }

        async function buscarMusica(query, tituloSeccion) {
            if (pestanaActual !== 'home') return;
            document.getElementById('sectionTitle').innerText = tituloSeccion;
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '<p style="color:var(--text-secondary);">Buscando música...</p>';

            try {
                const data = await fetchWithFallback(`/search?q=${encodeURIComponent(query)}&filter=videos`);

                if (pestanaActual !== 'home') return;

                const items = data.items || [];
                const cancionesFormateadas = items.map(item => {
                    const videoId = item.url ? item.url.replace('/watch?v=', '') : '';
                    return {
                        videoId: videoId,
                        title: item.title,
                        artist: item.uploaderName || 'Artista desconocido',
                        duration: item.duration
                    };
                }).filter(s => s.videoId);

                renderizarLista(cancionesFormateadas);
            } catch (error) {
                listContainer.innerHTML = '<p style="color:var(--text-secondary);">Error de conexión con los servidores. Vuelve a intentar en unos segundos.</p>';
            }
        }

        function renderizarLista(canciones, mensajeVacio = "No se encontraron resultados.") {
            const listContainer = document.getElementById('songList');
            listContainer.innerHTML = '';
            
            if (!canciones || canciones.length === 0) {
                listContainer.innerHTML = `<p style="color:var(--text-secondary);">${mensajeVacio}</p>`;
                return;
            }

            canciones.forEach(song => {
                const item = document.createElement('div');
                item.className = 'song-item';
                item.innerHTML = `
                    <div class="song-info">
                        <h4>${song.title}</h4>
                        <p>${song.artist}</p>
                    </div>
                    <div class="song-actions">
                        <button class="action-btn" title="Reproducir">▶</button>
                    </div>
                `;
                item.onclick = () => obtenerAudioYReproducir(song);
                listContainer.appendChild(item);
            });
        }

        async function obtenerAudioYReproducir(song) {
            document.getElementById('currentTitle').innerText = song.title;
            document.getElementById('currentArtist').innerText = song.artist;
            document.getElementById('loadingAudio').style.display = 'inline';

            try {
                const data = await fetchWithFallback(`/streams/${song.videoId}`);
                const audioStreams = data.audioStreams || [];
                
                if (audioStreams.length > 0) {
                    // Seleccionamos el flujo de audio con mejor estabilidad
                    const streamUrl = audioStreams[0].url;
                    
                    const player = document.getElementById('audioPlayer');
                    player.src = streamUrl;
                    player.play().catch(err => console.log("Reproducción bloqueada por autoplay:", err));
                    
                    registrarHistorialReproduccion(song);
                } else {
                    alert("No se encontró el flujo de audio para este archivo.");
                }
            } catch (e) {
                alert("No se pudo cargar la pista completa. Intenta con otra canción.");
            } finally {
                document.getElementById('loadingAudio').style.display = 'none';
            }
        }

        let timerBusqueda;
        function filtrarCanciones() {
            clearTimeout(timerBusqueda);
            const query = document.getElementById('searchInput').value.trim();

            if (query.length === 0) {
                cambiarPestana('home');
                return;
            }

            if (query.length > 2 && !busquedasRecientes.includes(query)) {
                busquedasRecientes.unshift(query);
                if (busquedasRecientes.length > 5) busquedasRecientes.pop();
                localStorage.setItem('historial_busquedas', JSON.stringify(busquedasRecientes));
            }

            timerBusqueda = setTimeout(() => {
                if (pestanaActual === 'history') cambiarPestana('home');
                buscarMusica(query, "Resultados de búsqueda");
            }, 600);
        }

        cargarSugerenciasIntuitivas();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
            });
        }
    </script>
</body>
</html>
